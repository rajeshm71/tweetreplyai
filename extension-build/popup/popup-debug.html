<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TweetReply Debug</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zM12 18c-.83 0-1.5-.67-1.5-1.5S11.17 15 12 15s1.5.67 1.5 1.5S12.83 18 12 18zM16.5 18c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
        </div>
        <span class="logo-text">TweetReply Debug</span>
      </div>
    </div>

    <!-- Debug State -->
    <div id="debug-state" class="state">
      <div class="debug-content">
        <h3>Debug Information</h3>
        <div id="debug-info">
          <p>Loading debug information...</p>
        </div>
        <button id="test-auth" class="primary-btn">Test Authentication</button>
        <button id="test-api" class="primary-btn">Test API</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const debugInfo = document.getElementById('debug-info');
      const testAuthBtn = document.getElementById('test-auth');
      const testApiBtn = document.getElementById('test-api');

      const clearDebugInfo = () => {
        while (debugInfo.firstChild) debugInfo.removeChild(debugInfo.firstChild);
      };

      const appendLine = (text, isStrong = false) => {
        const p = document.createElement('p');
        if (isStrong) {
          const strong = document.createElement('strong');
          strong.textContent = text;
          p.appendChild(strong);
        } else {
          p.textContent = text;
        }
        debugInfo.appendChild(p);
      };

      const getApiBaseUrl = async () => {
        const domainResponse = await new Promise((resolve) => {
          chrome.runtime.sendMessage({ action: 'getApiDomain' }, resolve);
        });
        const domain = domainResponse?.domain || 'tweetreplyai.vercel.app';
        const protocol = domain.includes('localhost') ? 'http' : 'https';
        return `${protocol}://${domain}`;
      };

      const resolveDebugAccess = async () => {
        try {
          const storageResult = await chrome.storage.local.get(['authToken']);
          const token = storageResult.authToken;
          if (!token) return false;

          const baseUrl = await getApiBaseUrl();
          const response = await fetch(`${baseUrl}/api/auth/user`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${token}`
            },
            credentials: 'include'
          });
          if (!response.ok) return false;

          const user = await response.json();
          return !!user?.isWhitelisted;
        } catch {
          return false;
        }
      };

      const showAccessDenied = () => {
        clearDebugInfo();
        appendLine('Debug access denied.');
        appendLine('This view is available only for whitelisted users.');
        testAuthBtn.disabled = true;
        testApiBtn.disabled = true;
      };

      const setupDebugView = async () => {
        const baseUrl = await getApiBaseUrl();

        // Test authentication (no token preview)
        testAuthBtn.addEventListener('click', async () => {
          try {
            const result = await chrome.storage.local.get(['authToken', 'authTime']);
            clearDebugInfo();
            appendLine('Authentication Test:', true);
            appendLine(`Token exists: ${!!result.authToken}`);
            appendLine(`Auth time: ${result.authTime ? new Date(result.authTime).toLocaleString() : 'None'}`);
          } catch {
            clearDebugInfo();
            appendLine('Auth test failed.');
          }
        });

        // Test API (no raw response body)
        testApiBtn.addEventListener('click', async () => {
          try {
            const result = await chrome.storage.local.get(['authToken']);
            const token = result.authToken;
            const response = await fetch(`${baseUrl}/api/auth/user`, {
              method: 'GET',
              headers: token ? { Authorization: `Bearer ${token}` } : {},
              credentials: 'include'
            });
            clearDebugInfo();
            appendLine('API Test:', true);
            appendLine(`Status: ${response.status}`);
            appendLine(`Status Text: ${response.statusText}`);
          } catch {
            clearDebugInfo();
            appendLine('API test failed.');
          }
        });

        clearDebugInfo();
        appendLine('Extension Debug Info:', true);
        appendLine(`Extension ID: ${chrome.runtime.id}`);
        appendLine(`Manifest version: ${chrome.runtime.getManifest().version}`);
        appendLine(`Current URL: ${window.location.href}`);
      };

      resolveDebugAccess().then((allowed) => {
        if (!allowed) {
          showAccessDenied();
          return;
        }
        setupDebugView().catch(() => {
          showAccessDenied();
        });
      });
    });
  </script>
</body>
</html>
