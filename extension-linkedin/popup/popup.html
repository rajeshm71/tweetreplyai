<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Reply AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <!-- LinkedIn "in" icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </div>
        <span class="logo-text">LinkedIn Reply AI</span>
      </div>
      <div class="header-actions">
        <button id="logout-btn" class="logout-btn hidden" title="Logout" aria-label="Logout from LinkedIn Reply AI">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg>
        </button>
        <button id="settings-btn" class="settings-btn" title="Settings" aria-label="Open settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span class="settings-btn-label">Settings</span>
        </button>
      </div>
    </div>

    <!-- Not Authenticated State -->
    <div id="not-authenticated" class="state hidden" role="region" aria-label="Authentication required">
      <div class="auth-content">
        <h2>Welcome to LinkedIn Reply AI</h2>
        <p>Sign in to start generating professional replies on LinkedIn</p>
        <button id="signin-btn" class="primary-btn" aria-label="Sign in to LinkedIn Reply AI">Sign In</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="state" role="status" aria-live="polite" aria-label="Loading">
      <div class="loading-content">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading...</p>
      </div>
    </div>

    <!-- Authenticated State -->
    <div id="authenticated" class="state hidden" role="main" aria-label="LinkedIn Reply AI dashboard">
      <!-- Quota Banner -->
      <div id="quota-banner" class="quota-banner hidden" role="alert">
        <div class="quota-banner-content">
          <span class="quota-banner-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
              <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
            </svg>
          </span>
          <div class="quota-banner-text">
            <strong>You've used <span id="quota-banner-used">--</span> / <span id="quota-banner-limit">--</span> credits</strong>
            <span>Upgrade now to keep the replies flowing!</span>
          </div>
          <button id="quota-banner-btn" class="quota-banner-upgrade">Upgrade</button>
        </div>
      </div>

      <!-- Welcome Header -->
      <div class="welcome-section">
        <div class="user-greeting">
          <span class="greeting-text">Hi, <span id="user-name" aria-label="User name">there</span>!</span>
          <span class="plan-badge" id="plan-badge" aria-label="Current plan">Free Plan</span>
        </div>
      </div>

      <!-- Usage Card -->
      <div class="usage-card" role="region" aria-label="Daily usage statistics">
        <div class="usage-header">
          <span class="usage-title">Credits Used</span>
          <span class="usage-period" id="usage-period">Today</span>
        </div>
        <div class="usage-bar-container" role="progressbar" aria-label="Credits usage">
          <div class="usage-bar">
            <div class="usage-fill" id="usage-fill" style="width: 0%"></div>
          </div>
          <div class="usage-numbers">
            <span id="usage-used">0</span> / <span id="usage-limit">--</span>
          </div>
        </div>
        <div class="usage-reset">Resets <span id="usage-reset-time">--</span></div>
      </div>

      <!-- Settings Panel -->
      <div id="settings-panel" class="settings-panel hidden" role="region" aria-label="Settings">
        <div class="settings-section">
          <h3 class="settings-section-title">Reply Style</h3>
          <div class="setting-item">
            <label for="prompt-select" class="setting-label">Default Tone</label>
            <select id="prompt-select" class="setting-select" aria-label="Select default reply tone">
              <option value="default">Default</option>
              <option value="professional">Professional</option>
              <option value="insightful">Insightful</option>
              <option value="conversational">Conversational</option>
              <option value="supportive">Supportive</option>
              <option value="direct">Direct</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="settings-section-title">Account</h3>
          <div class="setting-item">
            <span class="setting-label">Plan</span>
            <span id="settings-plan-name" class="setting-value">--</span>
          </div>
          <button id="upgrade-btn" class="secondary-btn hidden" aria-label="Upgrade plan">Upgrade Plan</button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="open-linkedin-btn" class="primary-btn" aria-label="Open LinkedIn">Open LinkedIn</button>
      </div>
    </div>
  </div>
  <script src="popup.bundle.js" type="module"></script>
</body>
</html>
